<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Bewohner-Verwaltung</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/frontend/bootstrapMain/css/bootstrap.min.css">
    <!-- Font Awesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Eigene Stylesheets -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/styleModal.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="/navbar-static/navbar.css">
    <script src="/navbar-static/navbar.js"></script>
    <!-- Google Material Icons einbinden -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>Bewohner-Verwaltung</h1>
            <div class="action-buttons">
                <button id="newResidentBtn" class="primary-btn">Neuer Bewohner</button>
                <button id="uploadBtn" class="primary-btn">
                    <i class="fas fa-upload"></i> Dokumentenerkennung von Personen
                </button>
                <button id="resurrectionBtn" class="secondary-btn">✝ Auferstehung</button>
                <button id="configBtn" class="secondary-btn">Konfiguration</button>
            </div>
        </header>

        <!-- Bewohnerliste -->
        <div id="residentsList" class="residents-grid"></div>
        <div id="residentContainer" class="residents-container"></div>

        <!-- Neuer Bewohner Modal -->
        <div id="newResidentForm" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Neuer Bewohner</h2>
                    <button type="button" class="icon-btn close-modal"></button>
                </div>
                <form id="newResidentFormContent">
                    <div class="fields-container">
                        <!-- Basis-Felder -->
                        <div class="form-group required-field">
                            <label for="firstName">Vorname</label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>
                        <div class="form-group required-field">
                            <label for="lastName">Nachname</label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>
                        <div class="gender-buttons-group">
                            <label>Geschlecht</label>
                            <div class="area-buttons" data-multiple="false">
                                <button type="button" class="secondary-btn area-button" data-gender="Herr">Herr</button>
                                <button type="button" class="secondary-btn area-button" data-gender="Frau">Frau</button>
                            </div>
                            <input type="hidden" name="gender" id="gender">
                            <div class="error-message" style="display: none; color: red;">
                                Bitte wählen Sie ein Geschlecht aus
                            </div>
                        </div>
                        <!-- Dynamische Felder -->
                        <div id="dynamicFields"></div>
                        <!-- Dynamische Bereiche -->
                        <div id="dynamicAreas"></div>
                    </div>
                    <div class="button-container">
                        <button type="submit" class="primary-btn">Speichern</button>
                        <button type="button" class="secondary-btn close-modal">Abbrechen</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bewohner Details Modal -->
        <div id="residentDetailModal" class="modal">
            <div class="modal-content">
                <!-- Wird dynamisch gefüllt -->
            </div>
        </div>

        <!-- Konfigurations-Modal -->
        <div id="configModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Konfiguration</h2>
                    <button type="button" class="icon-btn close-modal"></button>
                </div>
                <div class="config-content">
                    <!-- Tabs -->
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="fields">Felder</button>
                        <button class="tab-btn" data-tab="areas">Bereiche</button>
                        <button class="tab-btn" data-tab="filter">Filter</button>
                    </div>

                    <!-- Felder Tab -->
                    <div id="fieldsTab" class="tab-content active">
                        <div id="fieldsList"></div>
                        <button type="button" class="primary-btn" id="addFieldBtn">+ Feld hinzufügen</button>
                    </div>

                    <!-- Bereiche Tab -->
                    <div id="areasTab" class="tab-content">
                        <div id="areasList" class="areas-list"></div>
                    </div>

                    <!-- Filter Tab -->
                    <div id="filterTab" class="tab-content">
                        <div id="filterOptions"></div>
                    </div>
                </div>
                <div class="button-container">
                    <button type="button" class="primary-btn" id="saveConfigBtn">Speichern</button>
                </div>
            </div>
        </div>

        <!-- Auferstehungs-Modal -->
        <div id="resurrectionModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Entlassene Bewohner</h2>
                    <button type="button" class="icon-btn close-modal"></button>
                </div>
                <div class="fields-container">
                    <div id="dismissedResidentsList"></div>
                </div>
            </div>
        </div>

        <!-- OCR Modal -->
        <div id="ocrResultsModal" class="modal">
            <div class="modal-content">
                <!-- Wird dynamisch gefüllt -->
            </div>
        </div>

        <!-- OCR Volltext Modal -->
        <div id="fullTextModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Erkannter Text</h2>
                    <button type="button" class="icon-btn close-modal" onclick="Modal.hide('fullTextModal')">×</button>
                </div>
                <div class="modal-body">
                    <div class="ocr-selection-mode">
                        <div class="mode-indicator">
                            <span class="mode-text">Vorname auswählen</span>
                        </div>
                        <div class="selected-names-container">
                            <h3>Ausgewählte Namen</h3>
                            <div id="selectedNamesList" class="selected-names-list"></div>
                        </div>
                    </div>
                    <div class="ocr-scroll-container">
                        <div id="ocrFullText" class="ocr-full-text"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="secondary-btn" id="cancelOcrTextBtn">❌ Abbrechen</button>
                    <button type="button" class="primary-btn" id="submitOcrTextBtn">✅ Namen übernehmen</button>
                </div>
            </div>
        </div>

        <!-- Kamera Modal -->
        <div id="cameraModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Dokument scannen</h2>
                    <button type="button" class="icon-btn close-modal">×</button>
                </div>
                <div class="camera-wrapper">
                    <div class="camera-container">
                        <video id="cameraPreview" autoplay playsinline></video>
                        <div class="camera-hint">Dokument im Rahmen positionieren <br>und <br> Foto aufnehmen</div>
                    </div>
                    <!-- Container für Kamera-Buttons - keine Inhalte, werden in JS erzeugt -->
                    <div class="camera-controls"></div>
                </div>
            </div>
        </div>
        
        <!-- Smartphone Optionsmodal -->
        <div id="smartphoneOptionsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Dokument erfassen</h2>
                    <button type="button" class="icon-btn close-modal">×</button>
                </div>
                <div class="option-buttons">
                    <button type="button" id="openCameraBtn" class="action-btn">
                        <span class="option-icon">📷</span>
                        <span class="option-text">Foto aufnehmen</span>
                    </button>
                    <button type="button" id="openGalleryBtn" class="action-btn">
                        <span class="option-icon">🖼️</span>
                        <span class="option-text">Bild aus Galerie wählen</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle mit Popper.js -->
    <script src="/frontend/bootstrapMain/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript -->
    <script type="module" src="js/init.js"></script>
    <script type="module" src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Modal-Management
            document.querySelectorAll('.open-modal').forEach(btn => {
                btn.addEventListener('click', () => {
                    const modalId = btn.dataset.target;
                    document.getElementById(modalId).classList.add('show');
                });
            });

            document.querySelectorAll('.close-modal, .modal-background').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.modal').forEach(modal => {
                        modal.classList.remove('show');
                    });
                });
            });
        });
    </script>
</body>

</html>
